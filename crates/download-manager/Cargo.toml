[package]
name = "download-manager"
version = "0.1.0"
description = "Cross-platform resumable download manager"
license = "MIT"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
connectivity = { version = "0.1.0", git = "https://github.com/silvermine/tauri-plugin-connectivity", rev = "3f127708860d9cd1463e4c94628ac67db520c006" }
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.26.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt", "sync"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "log", "release_max_level_off"] }
reqwest = { version = "0.13.1", features = ["stream"] }
reqwest-middleware = "0.5.0"
reqwest-retry = "0.9.0"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt", "macros", "time"] }
wiremock = "0.6.2"
