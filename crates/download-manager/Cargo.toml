[package]
name = "download-manager"
version = "0.1.0"
description = "Cross-platform resumable download manager"
license = "MIT"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
connectivity = { version = "0.1.0", git = "https://github.com/silvermine/tauri-plugin-connectivity", rev = "af58bb43406d59ed4f905c488d09bb9544e9a7e3" }
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.26.0"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "log", "release_max_level_off"] }
reqwest = { version = "0.13.1", features = ["stream"] }
rustls = { version = "0.23.46", default-features = false }
reqwest-middleware = "0.5.0"
reqwest-retry = "0.9.0"
url = "2.5.8"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "net", "io-util"] }
wiremock = "0.6.2"
tokio-rustls = { version = "0.26.4", default-features = false }
